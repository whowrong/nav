<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>我的导航</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--ground:#f6f5f2;--card:#fff;--ink:#1c1c1c;--muted:#6b6b6b;--rule:#e3e1dc;--chip:#efeee9;
--serif:"Noto Serif SC","Songti SC","STSong",Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--ground:#141414;--card:#1f1f1f;--ink:#ececec;--muted:#9a9a9a;--rule:#2e2e2e;--chip:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font:600 28px/1.2 var(--serif);margin:0 0 4px}
.kicker{color:var(--muted);font-size:14px;margin:0 0 20px}
h2{font:600 15px/1.3 var(--sans);color:var(--muted);letter-spacing:.04em;margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
a.item{display:block;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;color:inherit;text-decoration:none;transition:border-color .15s}
a.item:hover,a.item:focus-visible{border-color:var(--muted);outline:none}
a.item:active{transform:scale(.99)}
.item b{display:block;font-size:16px;font-weight:600}
.item span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.item i{font-style:normal;font-family:var(--mono);font-size:11px;background:var(--chip);color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}

.gate{max-width:340px;margin:12vh auto 0;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:22px 20px}
.gate h1{margin-bottom:14px}
.gate input[type=password]{width:100%;font:16px/1.4 var(--sans);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.gate input[type=password]:focus{outline:none;border-color:var(--muted)}
.gate label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin:12px 0}
.gate button,.logout{font:600 15px/1 var(--sans);border-radius:8px;cursor:pointer}
.gate button{width:100%;padding:11px;border:0;background:var(--ink);color:var(--ground)}
.gate button:disabled{opacity:.6;cursor:wait}
.err{color:#c0392b;font-size:14px;min-height:20px;margin:10px 0 0}
.logout{display:block;margin:14px auto 0;padding:7px 14px;background:none;border:1px solid var(--rule);color:var(--muted);font-weight:400;font-size:13px}
</style>
</head>
<body><div class="wrap" id="app">
<form class="gate" id="gate" autocomplete="off">
<h1>我的导航</h1>
<input type="password" id="pw" placeholder="我的拼音名" autocomplete="current-password" autofocus required>
<label><input type="checkbox" id="remember"> 记住我</label>
<button type="submit" id="go">进入</button>
<p class="err" id="err" role="alert"></p>
</form>
</div>
<script>

var KEY='nav_key_v1';
var te=new TextEncoder(),td=new TextDecoder();
function ub(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function bu(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var salt=ub(P.salt),iv=ub(P.iv),ct=ub(P.ct),tag=P.salt;
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:P.iter},base,256));
}
async function open(raw){
  var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct));
}
function show(html){
  var app=document.getElementById('app');
  app.innerHTML=html;
  var b=document.createElement('button');
  b.className='logout';b.type='button';b.textContent='退出';
  b.onclick=function(){localStorage.removeItem(KEY);location.reload()};
  app.appendChild(b);
}
async function auto(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!s)return;
    if(s.tag!==tag){localStorage.removeItem(KEY);return}
    show(await open(ub(s.k)));
  }catch(e){localStorage.removeItem(KEY)}
}
document.getElementById('gate').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var go=document.getElementById('go'),err=document.getElementById('err');
  err.textContent='';go.disabled=true;go.textContent='解密中…';
  try{
    var raw=await derive(document.getElementById('pw').value);
    var html=await open(raw);
    if(document.getElementById('remember').checked)localStorage.setItem(KEY,JSON.stringify({tag:tag,k:bu(raw)}));
    show(html);
  }catch(e){
    err.textContent='拼音名不对';go.disabled=false;go.textContent='进入';
  }
});
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='这个浏览器不支持解密，请换用新版浏览器并通过 https 打开'}
else auto();
})();
